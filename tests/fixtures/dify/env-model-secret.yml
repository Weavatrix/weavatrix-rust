kind: app
version: 0.3.1
app:
  name: env-model-secret
  mode: workflow
workflow:
  conversation_variables: []
  environment_variables:
  - name: OPENAI_API_KEY
    value: sk-not-a-real-key
  - name: CHAT_MODEL
    value: gpt-4o-mini
  graph:
    edges: []
    nodes:
    - data:
        title: Env LLM
        type: llm
        model:
          provider: openai
          name: placeholder
          model_selector:
          - env
          - CHAT_MODEL
        prompt_template:
        - role: user
          text: hello
      id: env_llm
      type: custom
