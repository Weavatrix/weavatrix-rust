kind: app
version: 0.3.1
app:
  name: code-template
  mode: workflow
workflow:
  conversation_variables: []
  environment_variables: []
  graph:
    edges:
    - id: start-to-code
      source: start_node
      sourceHandle: source
      target: format_code
      targetHandle: target
    nodes:
    - data:
        title: Start
        type: start
        variables:
        - type: text-input
          variable: query
      id: start_node
      type: custom
    - data:
        title: Format Code
        type: code
        code_language: python3
        code: |
          def main(arg1: str) -> dict:
              return {"result": arg1}
        outputs:
          result:
            type: string
      id: format_code
      type: custom
