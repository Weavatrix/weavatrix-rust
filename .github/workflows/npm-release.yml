name: npm release

on:
  push:
    tags:
      - "npm-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "npm version to publish (defaults to npm/weavatrix/package.json)"
        required: false

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win32-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/weavatrix.exe
          - platform: win32-arm64
            runner: windows-latest
            target: aarch64-pc-windows-msvc
            binary: target/aarch64-pc-windows-msvc/release/weavatrix.exe
          - platform: darwin-x64
            runner: macos-14
            target: x86_64-apple-darwin
            binary: target/x86_64-apple-darwin/release/weavatrix
          - platform: darwin-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/weavatrix
          - platform: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: target/x86_64-unknown-linux-musl/release/weavatrix
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            binary: target/aarch64-unknown-linux-musl/release/weavatrix
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install musl toolchain
        if: startsWith(matrix.platform, 'linux')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          path: binaries
      - name: Assemble packages
        run: |
          VERSION="${{ github.event.inputs.version }}"
          for platform in win32-x64 win32-arm64 darwin-x64 darwin-arm64 linux-x64 linux-arm64; do
            case "$platform" in
              win32-*) binary="binaries/binary-$platform/weavatrix.exe" ;;
              *) binary="binaries/binary-$platform/weavatrix" ;;
            esac
            node scripts/build-npm-packages.mjs "$platform" "$binary" $VERSION
          done
          node scripts/build-npm-packages.mjs main $VERSION
      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in npm/dist/cli-*; do
            npm publish "$dir" --provenance --access public
          done
      - name: Publish weavatrix
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish npm/dist/weavatrix --provenance --access public
