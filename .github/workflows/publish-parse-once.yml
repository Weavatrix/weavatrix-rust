name: Publish sibling parse crate

on:
  workflow_dispatch:

jobs:
  publish:
    if: github.repository == 'Weavatrix/weavatrix-rust'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: Weavatrix/weavatrix-parse
          ref: a36c2068a6e699fd8e6f7af04626acefad4eeef0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # 2026-07-29
        with:
          toolchain: 1.89.0
      - name: Publish weavatrix-parse 0.3.4
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          VERSION="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')"
          [[ "$VERSION" == "0.3.4" ]]
          [[ -n "$CARGO_REGISTRY_TOKEN" ]] || { echo "CARGO_REGISTRY_TOKEN is empty" >&2; exit 1; }
          cargo publish --locked
